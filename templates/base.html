<!doctype html>
<html lang="si">
  <head>
    <meta charset="UTF-8" />
    <title>SSB Monthly Report {% if month %}— {{ month }}{% endif %}</title>
    <!-- Include Tailwind CSS -->
    <link href="{{ css_dir }}tailwind.min.css" rel="stylesheet">
    <style>
      /* Base Print Styling */
      @font-face {
          font-family: 'Noto Sans Sinhala';
          src: url('{{ fonts_dir }}NotoSansSinhala-Regular.ttf') format('truetype');
          font-weight: 400;
      }
      @font-face {
          font-family: 'Noto Sans Sinhala';
          src: url('{{ fonts_dir }}NotoSansSinhala-Medium.ttf') format('truetype');
          font-weight: 500;
      }
      @font-face {
          font-family: 'Noto Sans Sinhala';
          src: url('{{ fonts_dir }}NotoSansSinhala-SemiBold.ttf') format('truetype');
          font-weight: 600;
      }
      @font-face {
          font-family: 'Noto Sans Sinhala';
          src: url('{{ fonts_dir }}NotoSansSinhala-Bold.ttf') format('truetype');
          font-weight: 700;
      }

      /* English text fallback structure */
      @font-face {
          font-family: 'Inter';
          src: url('{{ fonts_dir }}Inter-Regular.woff2') format('woff2');
          font-weight: 400;
      }
      @font-face {
          font-family: 'Inter';
          src: url('{{ fonts_dir }}Inter-Medium.woff2') format('woff2');
          font-weight: 500;
      }
      @font-face {
          font-family: 'Inter';
          src: url('{{ fonts_dir }}Inter-SemiBold.woff2') format('woff2');
          font-weight: 600;
      }
      @font-face {
          font-family: 'Inter';
          src: url('{{ fonts_dir }}Inter-Bold.woff2') format('woff2');
          font-weight: 700;
      }

      body {
          font-family: 'Noto Sans Sinhala', 'Inter', sans-serif;
          font-size: 11pt;
          line-height: 1.6;
          color: #2C3E50; /* Charcoal */
          margin: 0;
          padding: 0;
          background-color: white;
      }

      /* PDF: A4 layout with Sinhala page counter */
      @page {
          size: A4 portrait;
          margin: 25mm 30mm 20mm 30mm;

          @top-center {
            content: "කාර්ය සාධන වාර්තාව"; /* Monthly performance report */
            font-size: 9pt;
            color: #6C757D;
          }

          @bottom-right {
              content: "පිටුව " counter(page);
              font-family: 'Noto Sans Sinhala', sans-serif;
              font-size: 9pt;
              color: #6C757D;
          }

          /* {% if mode == 'preview' %} */
          /* Draft Watermark */
          background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><text transform="translate(200,200) rotate(-45)" text-anchor="middle" fill="%23FF0000" fill-opacity="0.08" font-size="72" font-weight="bold" font-family="sans-serif">DRAFT</text></svg>');
          background-position: center center;
          background-repeat: no-repeat;
          background-size: 80%;
          /* {% endif %} */
      }

      /* Cover Page shouldn't have page numbers */
      @page cover { margin: 0; @bottom-right { content: none; } }

      div.cover-page {
          page: cover;
          height: 297mm; /* Full A4 height */
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          background-color: #f8f9fa;
      }

      /* ------------------------------------------------------------------------- */
      /* Utility Classes
      /* ------------------------------------------------------------------------- */
      h1, h2, h3 { color: #800000; font-weight: bold; }

      .page-break { page-break-before: always; }
      .keep-together { page-break-inside: avoid; }
      .section-title {
          border-bottom: 2px solid #800000;
          padding-bottom: 8px;
          margin-bottom: 20px;
          margin-top: 40px;
      }

      /* Tables */
      table {
          width: 100%;
          border-collapse: collapse;
          margin-bottom: 20px;
      }
      th, td {
          border: 1px solid #ddd;
          padding: 8px;
          text-align: left;
      }
      th {
          background-color: #800000;
          color: white;
          font-weight: bold;
      }
      tr:nth-child(even) { background-color: #f2f2f2; }

      /* Grid specific to components */
      .grid-container {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
          margin-bottom: 30px;
      }

      /* Event Cards */
      .event-card {
          border: 1px solid #ddd;
          padding: 15px;
          border-radius: 5px;
          box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
          background: white;
      }
      .event-card img {
          width: 100%;
          height: auto;
          border-radius: 3px;
          margin-bottom: 10px;
      }
      .event-title { font-weight: bold; color: #002366; font-size: 1.1em; }
      .event-date { color: #666; font-size: 0.9em; margin-bottom: 10px; }

      /* Embedded Charts */
      .chart-container {
          text-align: center;
          margin: 30px 0;
      }
      .chart-container img {
          max-width: 100%;
          height: auto;
          border: 1px solid #e0e0e0;
      }

      /* --------------------------------------------------------------- */
      /* Director / Board Grid                                            */
      /* --------------------------------------------------------------- */
      table.director-grid {
          width: 100%;
          border-collapse: separate;
          border-spacing: 16px;
          border: none;
          margin-bottom: 20px;
      }
      table.director-grid td,
      table.director-grid th {
          border: none;
          background: transparent;
      }
      .director-cell {
          width: 50%;
          vertical-align: top;
          text-align: center;
          padding: 12pt;
          background: #f9f9f9;
          border: 1px solid #e0e0e0;
          border-radius: 6px;
      }
      .director-photo {
          width: 160px;
          height: 160px;
          object-fit: cover;
          border-radius: 50%;
          border: 3px solid #800000;
          display: block;
          margin: 0 auto 10pt auto;
      }
      .director-name {
          font-weight: bold;
          font-size: 12pt;
          color: #002366;
          margin-bottom: 3pt;
      }
      .director-english {
          font-size: 9pt;
          color: #555;
          margin-bottom: 3pt;
      }
      .director-position {
          font-size: 10pt;
          font-weight: bold;
          color: #800000;
          margin-bottom: 8pt;
      }
      .director-bio {
          font-size: 9pt;
          text-align: justify;
          color: #444;
          margin: 0;
      }

      .text-right { text-align: right; }
      .text-center { text-align: center; }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
